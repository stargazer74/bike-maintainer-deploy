# Bike Maintainer in household mode: for a trusted home network only (e.g. on a Raspberry Pi). No login – everyone
# in the household picks their profile. Do NOT forward this port in your router; for internet use see ../portal/.
services:
  bm-mariadb:
    image: 'mariadb:11'
    restart: unless-stopped
    environment:
      - 'MARIADB_DATABASE=maintenance'
      - 'MARIADB_USER=maintenance'
      - 'MARIADB_PASSWORD=${BM_DB_PASSWORD:?set BM_DB_PASSWORD in .env}'
      - 'MARIADB_RANDOM_ROOT_PASSWORD=1'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
    healthcheck:
      test: [ 'CMD', 'healthcheck.sh', '--connect', '--innodb_initialized' ]
      interval: 5s
      timeout: 5s
      retries: 10
  bm-backend:
    image: 'ghcr.io/stargazer74/bike-maintainer-backend:${BM_VERSION:-1}'
    restart: unless-stopped
    environment:
      - 'BM_MODE=household'
      - 'DB_HOST=bm-mariadb'
      - 'DB_PORT=3306'
      - 'DB_NAME=maintenance'
      - 'DB_USERNAME=maintenance'
      - 'DB_PASSWORD=${BM_DB_PASSWORD:?set BM_DB_PASSWORD in .env}'
    depends_on:
      bm-mariadb:
        condition: service_healthy
  bm-frontend:
    image: 'ghcr.io/stargazer74/bike-maintainer-frontend:${BM_VERSION:-1}'
    restart: unless-stopped
    environment:
      # The frontend's nginx forwards /api to the backend inside the compose network.
      - 'BACKEND_HOST=bm-backend:8080'
    # The only published port: the app is reachable at http://<host>:${BM_PORT}.
    ports:
      - '${BM_PORT:-8080}:80'
    depends_on:
      - bm-backend

volumes:
  mariadb-data:
