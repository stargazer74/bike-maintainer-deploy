version: 2
updates:
  # Third-party images in the compose files (mariadb, phpmyadmin, mailpit in dev/). The app's own images follow
  # BM_VERSION and are released from their repos, and dev/ builds its own images locally – both are ignored here.
  - package-ecosystem: docker-compose
    directories: [ /portal, /household, /dev ]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ghcr.io/stargazer74/bike-maintainer-backend
      - dependency-name: ghcr.io/stargazer74/bike-maintainer-frontend
      - dependency-name: ghcr.io/stargazer74/bike-maintainer-portal
      - dependency-name: 'bike-maintainer-dev/*'
      # Stay on the current major versions (mariadb:11, phpmyadmin:5); major upgrades are a deliberate decision.
      - dependency-name: '*'
        update-types: [ version-update:semver-major ]
