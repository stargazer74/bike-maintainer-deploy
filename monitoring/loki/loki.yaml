# Single-process Loki with storage on the local filesystem. Only reachable inside the monitoring stack, hence no auth.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Logs are kept 14 days, then deleted by the compactor (data minimisation; IPs are truncated before by Alloy).
limits_config:
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# No usage statistics to Grafana Labs.
analytics:
  reporting_enabled: false
