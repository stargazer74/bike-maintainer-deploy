# Alert mails to BM_ALERT_EMAIL (compose.yaml, default alert@bike-maintainer.de), sent via the SMTP settings GF_SMTP_*.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: alert-email
        type: email
        settings:
          addresses: ${BM_ALERT_EMAIL}
          singleEmail: true
