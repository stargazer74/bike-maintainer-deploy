# Only the frontend and the website are reachable, and only through the nginx-proxy-manager's network. The database
# publishes no port; phpMyAdmin is optional (compose profile "tools") and listens on the host's loopback interface only.
services:
  bike-maintainer-mariadb:
    image: 'mariadb:11'
    container_name: 'bike-maintainer-mariadb'
    restart: unless-stopped
    environment:
      - 'MARIADB_DATABASE=maintenance'
      - 'MARIADB_USER=maintenance'
      - 'MARIADB_PASSWORD=${BM_DB_PASSWORD:?set BM_DB_PASSWORD in .env}'
      # Nobody needs root: the app and phpMyAdmin use the "maintenance" user.
      - 'MARIADB_RANDOM_ROOT_PASSWORD=1'
      # Read by mariadb-init/10-website.sh: own database and user for the website (WordPress), rights only on it.
      - 'BM_WEBSITE_DB_PASSWORD=${BM_WEBSITE_DB_PASSWORD:?set BM_WEBSITE_DB_PASSWORD in .env}'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
      # Runs only when the data directory is empty (first start); existing installations: see README.
      - './mariadb-init:/docker-entrypoint-initdb.d:ro'
    networks:
      - default
      - website
    healthcheck:
      test: [ 'CMD', 'healthcheck.sh', '--connect', '--innodb_initialized' ]
      interval: 5s
      timeout: 5s
      retries: 10
  # Only started with `docker compose --profile tools up -d`. Bound to 127.0.0.1 – Docker would otherwise publish the
  # port past a host firewall such as ufw. Reach it via SSH tunnel: ssh -L 8081:127.0.0.1:8081 <server>, then open
  # http://localhost:8081 and log in as "maintenance" with BM_DB_PASSWORD (no auto-login).
  bike-maintainer-phpmyadmin:
    image: 'phpmyadmin:5'
    container_name: 'bike-maintainer-phpmyadmin'
    restart: unless-stopped
    profiles: [ 'tools' ]
    environment:
      - 'PMA_HOST=bike-maintainer-mariadb'
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      - bike-maintainer-mariadb
  bike-maintainer-backend:
    image: 'ghcr.io/stargazer74/bike-maintainer-backend:${BM_VERSION:-0}'
    # Fixed name instead of <project>-bike-maintainer-backend-1, e.g. for `docker logs`; only one installation per host.
    container_name: 'bike-maintainer-backend'
    restart: unless-stopped
    environment:
      - 'DB_HOST=bike-maintainer-mariadb'
      - 'DB_PORT=3306'
      - 'DB_NAME=maintenance'
      - 'DB_USERNAME=maintenance'
      - 'DB_PASSWORD=${BM_DB_PASSWORD:?set BM_DB_PASSWORD in .env}'
      # Initial admin (owner of all vehicles from before user accounts). Set both in a .env file next to
      # this file, not here (public repo). The email is only read when migration V4 runs; the password
      # is only applied while the admin has none. Compose refuses to start if either is missing.
      - 'BM_INITIAL_ADMIN_EMAIL=${BM_INITIAL_ADMIN_EMAIL:?set BM_INITIAL_ADMIN_EMAIL in .env}'
      - 'BM_INITIAL_ADMIN_PASSWORD=${BM_INITIAL_ADMIN_PASSWORD:?set BM_INITIAL_ADMIN_PASSWORD in .env}'
      # Registration emails and captcha (backend 0.3+). Secrets only in .env; compose refuses to start without them.
      - 'SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.ionos.de}'
      - 'SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}'
      - 'SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-noreply@bike-maintainer.de}'
      - 'SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:?set SPRING_MAIL_PASSWORD in .env}'
      - 'BM_MAIL_FROM=${BM_MAIL_FROM:-noreply@bike-maintainer.de}'
      - 'BM_PUBLIC_URL=${BM_PUBLIC_URL:-https://app.bike-maintainer.de}'
      - 'BM_ALTCHA_HMAC_KEY=${BM_ALTCHA_HMAC_KEY:?set BM_ALTCHA_HMAC_KEY in .env}'
      # One JSON line per log entry (ECS), so the monitoring (monitoring/) can filter by level and endpoint.
      - 'LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs'
    # The image has neither curl nor wget; bash's /dev/tcp asks the actuator on the management port.
    healthcheck:
      test: [ 'CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/8081 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # monitoring: only the monitoring's collector (Alloy) reaches the metrics on port 8081 through this network.
    networks:
      - default
      - monitoring
    depends_on:
      bike-maintainer-mariadb:
        condition: service_healthy
  bike-maintainer-frontend:
    image: 'ghcr.io/stargazer74/bike-maintainer-frontend:${BM_VERSION:-0}'
    # Fixed name instead of <project>-bike-maintainer-frontend-1, e.g. for `docker logs`; only one installation per host.
    container_name: 'bike-maintainer-frontend'
    restart: unless-stopped
    environment:
      # The frontend's nginx forwards /api to the backend inside the compose network.
      - 'BACKEND_HOST=bike-maintainer-backend:8080'
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only.
      test: [ 'CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1/' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - proxy
    depends_on:
      bike-maintainer-backend:
        condition: service_healthy

  # Website (bike-maintainer.de) with forum: official WordPress plus our theme and must-use plugins. WordPress
  # updates core, plugins and the parent theme itself inside the volume; the image only brings our own code.
  bike-maintainer-website:
    image: 'ghcr.io/stargazer74/bike-maintainer-portal:${BM_WEBSITE_VERSION:-0}'
    container_name: 'bike-maintainer-website'
    restart: unless-stopped
    environment:
      - 'WORDPRESS_DB_HOST=bike-maintainer-mariadb'
      - 'WORDPRESS_DB_NAME=wordpress'
      - 'WORDPRESS_DB_USER=wordpress'
      - 'WORDPRESS_DB_PASSWORD=${BM_WEBSITE_DB_PASSWORD:?set BM_WEBSITE_DB_PASSWORD in .env}'
      # Behind the proxy: the image's wp-config already takes HTTPS from X-Forwarded-Proto; the admin stays on HTTPS.
      - "WORDPRESS_CONFIG_EXTRA=define( 'FORCE_SSL_ADMIN', true );"
      # Target of the "Zur App" links.
      - 'BM_APP_URL=${BM_PUBLIC_URL:-https://app.bike-maintainer.de}'
      # Own ALTCHA key for registration and lost password of website/forum – not the app's key.
      - 'BM_ALTCHA_HMAC_KEY=${BM_WEBSITE_ALTCHA_HMAC_KEY:?set BM_WEBSITE_ALTCHA_HMAC_KEY in .env}'
      # Mail via the same mailbox as the app (noreply@ at IONOS, STARTTLS on 587).
      - 'BM_SMTP_HOST=${SPRING_MAIL_HOST:-smtp.ionos.de}'
      - 'BM_SMTP_PORT=${SPRING_MAIL_PORT:-587}'
      - 'BM_SMTP_USER=${SPRING_MAIL_USERNAME:-noreply@bike-maintainer.de}'
      - 'BM_SMTP_PASSWORD=${SPRING_MAIL_PASSWORD:?set SPRING_MAIL_PASSWORD in .env}'
      - 'BM_SMTP_FROM=${BM_MAIL_FROM:-noreply@bike-maintainer.de}'
      # Only for the first installation with bm-setup (see README).
      - 'BM_SITE_URL=${BM_WEBSITE_URL:-https://bike-maintainer.de}'
      - 'BM_ADMIN_USER=${BM_WEBSITE_ADMIN_USER:-admin}'
      - 'BM_ADMIN_EMAIL=${BM_WEBSITE_ADMIN_EMAIL:-}'
      - 'BM_ADMIN_PASSWORD=${BM_WEBSITE_ADMIN_PASSWORD:-}'
    volumes:
      - 'website-data:/var/www/html'
    # Reaches only the database (network "website"), not the backend; only the proxy reaches the website (as
    # bike-maintainer-website:80). Outgoing traffic (updates, mail) goes through the proxy network.
    networks:
      - website
      - proxy
    depends_on:
      bike-maintainer-mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
  website-data:

# No ports are published: the existing nginx-proxy-manager on the host reaches the frontend and the website by service
# name over this shared network (bike-maintainer-frontend:80, bike-maintainer-website:80). The frontend's nginx forwards /api/ to
# bike-maintainer-backend internally, so the backend stays in the default network only.
networks:
  # Website and database only: WordPress has the largest attack surface of the stack, so it must not reach the
  # backend (including its management port). Internal: no route to the outside through this network.
  website:
    internal: true
  proxy:
    external: true
    name: '${PROXY_NETWORK:?set PROXY_NETWORK in .env}'
  # Shared with the monitoring stack (monitoring/compose.yaml); create once: docker network create bike-maintainer-monitoring
  monitoring:
    external: true
    name: 'bike-maintainer-monitoring'
